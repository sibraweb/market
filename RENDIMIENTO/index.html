<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIBRA · Rendimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<!-- Todo sale de Supabase (SibraMaestros.rest ya resuelve la sesión con
     ensureLogin), así que este módulo no necesita el OAuth de Google. -->
<script src="../shared/sibra-maestros.js"></script>
<style>
:root{
  --red:#E10600; --red-dark:#B00500; --bg:#0d0d0d; --bg2:#141414; --bg3:#1a1a1a;
  --bg4:#222; --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#f0f0f0; --text2:#a0a0a0; --text3:#666;
  --pos:#22c55e; --neg:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Raleway,system-ui,sans-serif;font-size:14px;padding:18px}
h1{font-family:Montserrat;font-size:19px;font-weight:700;letter-spacing:.5px}
h1 span{color:var(--red)}
header{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
header .sub{color:var(--text3);font-size:12px}

/* ── barra de filtros ─────────────────────────────────────────── */
.filtros{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo>label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3)}
input,select,button{font-family:inherit;font-size:13px;color:var(--text);
  background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:7px 9px}
input:focus,select:focus{outline:none;border-color:var(--red)}
button{cursor:pointer;transition:.15s}
button:hover{background:var(--bg4)}
button.on{background:var(--red);border-color:var(--red);font-weight:600}
.grupo{display:flex;gap:0}
.grupo button{border-radius:0;border-right:none}
.grupo button:first-child{border-radius:6px 0 0 6px}
.grupo button:last-child{border-radius:0 6px 6px 0;border-right:1px solid var(--border2)}

/* ── multiselect con búsqueda al tipear ───────────────────────── */
.ms{position:relative;min-width:190px}
.ms-box{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
  padding:5px 7px;min-height:34px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:text}
.ms-box:focus-within{border-color:var(--red)}
.ms-tag{background:var(--bg4);border-radius:4px;padding:2px 5px;font-size:11px;display:flex;gap:5px;align-items:center}
.ms-tag b{font-weight:500}
.ms-tag i{cursor:pointer;color:var(--text3);font-style:normal}
.ms-tag i:hover{color:var(--red)}
.ms-inp{border:none;background:none;padding:2px;flex:1;min-width:60px;font-size:12px}
.ms-inp:focus{outline:none}
.ms-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;max-height:230px;
  overflow:auto;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;display:none}
.ms-pop.open{display:block}
.ms-opt{padding:6px 9px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.ms-opt:hover,.ms-opt.sel{background:var(--bg4)}
.ms-opt small{color:var(--text3)}
.ms-none{padding:8px 9px;color:var(--text3);font-size:12px}

/* ── tabs y tarjetas ──────────────────────────────────────────── */
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav button{border-radius:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:5px}
.card strong{font-family:Montserrat;font-size:20px;font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{font-family:Montserrat;font-size:13px;font-weight:600;margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.8px;color:var(--text2)}
.tabla{overflow:auto;max-height:62vh}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
th{position:sticky;top:0;background:var(--bg3);text-align:right;padding:7px 9px;
  font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:6px 9px;text-align:right;border-top:1px solid var(--border)}
tbody tr:hover{background:var(--bg3)}
tfoot td{border-top:2px solid var(--border2);font-weight:600;background:var(--bg3);position:sticky;bottom:0}
.vacio{color:var(--text3);padding:22px;text-align:center}
.alerta{background:rgba(225,6,0,.1);border:1px solid rgba(225,6,0,.35);border-radius:8px;
  padding:10px 12px;margin-bottom:12px;font-size:12.5px}
.ok{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3)}
.hide{display:none}
.chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;background:var(--bg4);color:var(--text2)}
</style>
</head>
<body>

<header>
  <h1>SIBRA<span>·</span>RENDIMIENTOS</h1>
  <div class="sub" id="sello">cargando…</div>
</header>

<div class="filtros">
  <div class="campo"><label>Clientes</label><div id="msCliente"></div></div>
  <div class="campo"><label>ALyC</label><div id="msAlyc"></div></div>
  <div class="campo"><label>Comitentes</label><div id="msCuenta"></div></div>
  <div class="campo"><label>Títulos</label><div id="msTicker"></div></div>

  <div class="campo"><label>Ventana</label>
    <div class="grupo" id="presets">
      <button data-p="MTD">MTD</button>
      <button data-p="YTD" class="on">YTD</button>
      <button data-p="1A">1 año</button>
      <button data-p="5A">5 años</button>
      <button data-p="TODO">Todo</button>
    </div>
  </div>
  <div class="campo"><label>Desde</label><input type="date" id="desde"></div>
  <div class="campo"><label>Hasta</label><input type="date" id="hasta"></div>

  <div class="campo"><label>Moneda</label>
    <div class="grupo" id="moneda">
      <button data-m="ARS" class="on">$</button>
      <button data-m="USD">USD</button>
    </div>
  </div>
  <div class="campo"><label>Frecuencia</label>
    <div class="grupo" id="freq">
      <button data-f="W" class="on">Semanal</button>
      <button data-f="M">Mensual</button>
    </div>
  </div>
  <div class="campo"><label>&nbsp;</label><button id="recargar">Recargar</button></div>
</div>

<nav>
  <button data-t="evolucion" class="on">Evolución</button>
  <button data-t="cerradas">Posiciones cerradas</button>
  <button data-t="abiertas">Posiciones abiertas</button>
  <button data-t="control">Control</button>
</nav>

<div id="aviso"></div>

<section id="tab-evolucion">
  <div class="cards" id="kpis"></div>
  <div class="panel"><h2>Evolución de la cartera</h2><canvas id="grafico" height="92"></canvas></div>
  <div class="panel"><h2>Rendimiento por período</h2><div class="tabla" id="tPeriodos"></div></div>
</section>

<section id="tab-cerradas" class="hide">
  <div class="cards" id="kpisCerradas"></div>
  <div class="panel"><h2>Cada cierre contra su precio de compra y sus días de tenencia</h2>
    <div class="tabla" id="tCerradas"></div></div>
</section>

<section id="tab-abiertas" class="hide">
  <div class="cards" id="kpisAbiertas"></div>
  <div class="panel"><h2>Posiciones abiertas</h2><div class="tabla" id="tAbiertas"></div></div>
</section>

<section id="tab-control" class="hide">
  <div class="cards" id="kpisControl"></div>
  <div class="panel"><h2>Lo que no cierra contra la tenencia del broker</h2>
    <div class="tabla" id="tControl"></div></div>
</section>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  Módulo de rendimientos de Market Suite.
//
//  Lee la FOTO que publica el motor FIFO de sibra-brokers en Supabase:
//    brokers_curva                serie semanal/mensual de valuación
//    brokers_realizado            un tramo vendido por fila (posiciones cerradas)
//    brokers_posiciones_abiertas  posiciones vivas revaluadas a spot
//    brokers_tenencias            lo que informa el broker -> control
//
//  Todo se puede mirar en PESOS o en DÓLARES, por ventana de fechas, y con
//  varias cuentas a la vez: un cliente como Brade tiene varias y lo que
//  interesa es la evolución de todas juntas.
// ═══════════════════════════════════════════════════════════════════════
const S = {
  curva: [], realizado: [], abiertas: [], tenencias: [],
  moneda: 'ARS', freq: 'W', tab: 'evolucion', preset: 'YTD',
  sel: { cliente: [], alyc: [], cuenta: [], ticker: [] },
  orden: {},
};
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const fmt = (v, d = 2) => v == null || !Number.isFinite(v) ? '—'
  : v.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => v == null || !Number.isFinite(v) ? '—' : (v >= 0 ? '+' : '') + fmt(v, 2) + '%';
const signo = v => v == null || !Number.isFinite(v) || v === 0 ? '' : (v > 0 ? 'pos' : 'neg');
const hoy = () => new Date().toISOString().slice(0, 10);

// ── Multiselect que filtra al tipear ───────────────────────────────────
// Pedido explícito: "todo lo que sea para elegir que tenga array y que se
// vaya filtrando al escribir".
function multiselect(host, { placeholder, onChange }) {
  const el = typeof host === 'string' ? $(host) : host;
  let opciones = [], elegidas = [], marca = 0;
  el.className = 'ms';
  el.innerHTML = `<div class="ms-box"><input class="ms-inp" placeholder="${placeholder}"></div>
                  <div class="ms-pop"></div>`;
  const box = el.querySelector('.ms-box'), inp = el.querySelector('.ms-inp'), pop = el.querySelector('.ms-pop');

  const visibles = () => {
    const q = inp.value.trim().toLowerCase();
    return opciones.filter(o => !elegidas.includes(o.valor) &&
      (!q || o.texto.toLowerCase().includes(q) || String(o.valor).toLowerCase().includes(q)));
  };
  function pintarTags() {
    box.querySelectorAll('.ms-tag').forEach(t => t.remove());
    elegidas.forEach(v => {
      const o = opciones.find(x => x.valor === v) || { texto: v };
      const t = document.createElement('span');
      t.className = 'ms-tag';
      t.innerHTML = `<b></b><i>×</i>`;
      t.querySelector('b').textContent = o.texto;
      t.querySelector('i').onclick = e => { e.stopPropagation(); quitar(v); };
      box.insertBefore(t, inp);
    });
    inp.placeholder = elegidas.length ? '' : placeholder;
  }
  function pintarPop() {
    const vs = visibles();
    marca = Math.min(marca, vs.length - 1);
    pop.innerHTML = vs.length
      ? vs.map((o, i) => `<div class="ms-opt${i === marca ? ' sel' : ''}" data-v="${o.valor}">
           <span></span><small>${o.nota || ''}</small></div>`).join('')
      : '<div class="ms-none">sin coincidencias</div>';
    pop.querySelectorAll('.ms-opt').forEach((d, i) => {
      d.querySelector('span').textContent = vs[i].texto;
      d.onmousedown = e => { e.preventDefault(); agregar(vs[i].valor); };
    });
  }
  const agregar = v => { if (!elegidas.includes(v)) elegidas.push(v); inp.value = ''; marca = 0; pintarTags(); pintarPop(); onChange(elegidas.slice()); };
  const quitar = v => { elegidas = elegidas.filter(x => x !== v); pintarTags(); pintarPop(); onChange(elegidas.slice()); };

  box.onclick = () => inp.focus();
  inp.onfocus = () => { marca = 0; pintarPop(); pop.classList.add('open'); };
  inp.onblur = () => setTimeout(() => pop.classList.remove('open'), 120);
  inp.oninput = () => { marca = 0; pintarPop(); pop.classList.add('open'); };
  inp.onkeydown = e => {
    const vs = visibles();
    if (e.key === 'ArrowDown') { marca = Math.min(marca + 1, vs.length - 1); pintarPop(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { marca = Math.max(marca - 1, 0); pintarPop(); e.preventDefault(); }
    else if (e.key === 'Enter' && vs[marca]) { agregar(vs[marca].valor); e.preventDefault(); }
    else if (e.key === 'Backspace' && !inp.value && elegidas.length) quitar(elegidas[elegidas.length - 1]);
  };
  return {
    set(nuevas) {
      opciones = nuevas;
      // si una opción elegida dejó de existir (cambió el filtro de arriba), se cae sola
      const validas = new Set(nuevas.map(o => o.valor));
      const antes = elegidas.length;
      elegidas = elegidas.filter(v => validas.has(v));
      pintarTags(); pintarPop();
      if (elegidas.length !== antes) onChange(elegidas.slice());
    },
  };
}

// ── Ventana de fechas ──────────────────────────────────────────────────
function aplicarPreset(p) {
  const h = new Date(), y = h.getFullYear();
  const iso = d => d.toISOString().slice(0, 10);
  let desde;
  if (p === 'MTD') desde = iso(new Date(y, h.getMonth(), 1));
  else if (p === 'YTD') desde = iso(new Date(y, 0, 1));
  else if (p === '1A') desde = iso(new Date(y - 1, h.getMonth(), h.getDate()));
  else if (p === '5A') desde = iso(new Date(y - 5, h.getMonth(), h.getDate()));
  else desde = '2000-01-01';
  $('#desde').value = desde;
  $('#hasta').value = hoy();
}

// ── Filtrado común ─────────────────────────────────────────────────────
const enVentana = f => {
  const d = String(f || '').slice(0, 10);
  return d && d >= $('#desde').value && d <= $('#hasta').value;
};
function pasa(r, { conTicker = true } = {}) {
  const s = S.sel;
  if (s.cliente.length && !s.cliente.includes(r.client_name)) return false;
  if (s.alyc.length && !s.alyc.includes(r.broker_code)) return false;
  if (s.cuenta.length && !s.cuenta.includes(String(r.account))) return false;
  if (conTicker && s.ticker.length && !s.ticker.includes(String(r.ticker || '').toUpperCase())) return false;
  return true;
}

// ── Evolución: agrega varias cuentas en una sola serie ─────────────────
// No se pueden promediar porcentajes de cuentas distintas: se suman los
// VALORES y los FLUJOS por fecha, y recién ahí se calcula el retorno del
// período (descontando el flujo, que es capital que entró o salió y no
// gestión) y se encadena el acumulado.
function serieAgregada() {
  const por = new Map();
  S.curva.filter(r => r.freq === S.freq && pasa(r, { conTicker: false }) && enVentana(r.fecha))
    .forEach(r => {
      const f = String(r.fecha).slice(0, 10);
      const a = por.get(f) || { fecha: f, valor: 0, flujo: 0, n: 0, fx: 0, sinPrecio: 0 };
      const usd = S.moneda === 'USD';
      a.valor += num(usd ? r.valor_usd : r.valor_ars);
      // el flujo se publica en ARS: en dólares se pasa por el fx de esa fecha
      const fx = num(r.fx) || 1;
      a.flujo += usd ? num(r.flujo_ars) / fx : num(r.flujo_ars);
      a.n += num(r.n_posiciones); a.fx = fx; a.sinPrecio += num(r.sin_precio);
      por.set(f, a);
    });
  const filas = [...por.values()].sort((a, b) => a.fecha.localeCompare(b.fecha));
  let acum = 1;
  filas.forEach((f, i) => {
    const prev = i ? filas[i - 1].valor : null;
    // retorno = (valor_final − flujo) / valor_inicial − 1
    f.retorno = prev ? ((f.valor - f.flujo) / prev - 1) * 100 : null;
    if (f.retorno != null) acum *= (1 + f.retorno / 100);
    f.acum = i === 0 ? 0 : (acum - 1) * 100;
  });
  return filas;
}

// ── Render ─────────────────────────────────────────────────────────────
const sim = () => S.moneda === 'USD' ? 'US$' : '$';

function tabla(host, cols, filas, totales) {
  const el = $(host);
  if (!filas.length) { el.innerHTML = '<div class="vacio">Sin datos para esta selección.</div>'; return; }
  const o = S.orden[host];
  if (o) {
    const c = cols.find(c => c.k === o.k);
    filas = filas.slice().sort((a, b) => {
      const x = c.n ? num(a[o.k]) : String(a[o.k] ?? ''), y = c.n ? num(b[o.k]) : String(b[o.k] ?? '');
      return (x < y ? -1 : x > y ? 1 : 0) * (o.asc ? 1 : -1);
    });
  }
  el.innerHTML = `<table><thead><tr>${cols.map(c =>
      `<th class="${c.n ? '' : 'l'}" data-k="${c.k}">${c.t}${o && o.k === c.k ? (o.asc ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${filas.map(f => `<tr>${cols.map(c => {
      const v = c.f ? c.f(f) : f[c.k];
      const cls = c.color ? signo(num(f[c.k])) : '';
      return `<td class="${c.n ? '' : 'l'} ${cls}">${v ?? '—'}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
    ${totales ? `<tfoot><tr>${cols.map(c => `<td class="${c.n ? '' : 'l'} ${totales[c.k + '_cls'] || ''}">${totales[c.k] ?? ''}</td>`).join('')}</tr></tfoot>` : ''}</table>`;
  el.querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    S.orden[host] = { k, asc: !(o && o.k === k && o.asc) };
    render();
  });
}

function kpis(host, items) {
  $(host).innerHTML = items.map(i =>
    `<div class="card"><span>${i.t}</span><strong class="${i.cls || ''}">${i.v}</strong></div>`).join('');
}

let chart;
function pintarEvolucion() {
  const s = serieAgregada();
  const ult = s[s.length - 1];
  kpis('#kpis', [
    { t: `Valor de cartera (${sim()})`, v: ult ? fmt(ult.valor, 0) : '—' },
    { t: 'Rendimiento del período', v: ult ? pct(ult.acum) : '—', cls: ult ? signo(ult.acum) : '' },
    { t: 'Mejor período', v: s.length ? pct(Math.max(...s.map(f => f.retorno ?? -1e9))) : '—', cls: 'pos' },
    { t: 'Peor período', v: s.length ? pct(Math.min(...s.map(f => f.retorno ?? 1e9))) : '—', cls: 'neg' },
    { t: 'Cortes', v: String(s.length) },
  ]);
  const ctx = $('#grafico');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: s.map(f => f.fecha),
      datasets: [
        { label: `Valor (${sim()})`, data: s.map(f => f.valor), borderColor: '#E10600',
          backgroundColor: 'rgba(225,6,0,.10)', fill: true, tension: .25, pointRadius: 0, yAxisID: 'y' },
        { label: 'Acumulado %', data: s.map(f => f.acum), borderColor: '#22c55e',
          borderDash: [5, 4], fill: false, tension: .25, pointRadius: 0, yAxisID: 'y1' },
      ],
    },
    options: {
      responsive: true, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#a0a0a0', font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: '#666', maxTicksLimit: 14, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,.05)' } },
        y: { ticks: { color: '#666', font: { size: 10 }, callback: v => fmt(v, 0) }, grid: { color: 'rgba(255,255,255,.05)' } },
        y1: { position: 'right', ticks: { color: '#22c55e', font: { size: 10 }, callback: v => fmt(v, 1) + '%' }, grid: { display: false } },
      },
    },
  });
  tabla('#tPeriodos', [
    { k: 'fecha', t: 'Corte' },
    { k: 'valor', t: `Valor ${sim()}`, n: 1, f: f => fmt(f.valor, 0) },
    { k: 'flujo', t: `Aportes/retiros ${sim()}`, n: 1, f: f => fmt(f.flujo, 0), color: 1 },
    { k: 'retorno', t: 'Período', n: 1, f: f => pct(f.retorno), color: 1 },
    { k: 'acum', t: 'Acumulado', n: 1, f: f => pct(f.acum), color: 1 },
    { k: 'n', t: 'Posiciones', n: 1, f: f => fmt(f.n, 0) },
  ], s.slice().reverse());
}

function pintarCerradas() {
  const usd = S.moneda === 'USD';
  const f = S.realizado.filter(r => pasa(r) && enVentana(r.fecha_venta));
  const g = (r, a, b) => num(usd ? r[b] : r[a]);
  const total = f.reduce((s, r) => s + g(r, 'resultado_total', 'resultado_total_usd'), 0);
  const ganadoras = f.filter(r => g(r, 'resultado_total', 'resultado_total_usd') > 0).length;
  const dptProm = f.length ? f.reduce((s, r) => s + num(r.dias_tenencia), 0) / f.length : 0;
  kpis('#kpisCerradas', [
    { t: `Resultado realizado (${sim()})`, v: fmt(total, 0), cls: signo(total) },
    { t: 'Cierres', v: String(f.length) },
    { t: 'Ganadoras', v: f.length ? `${ganadoras} (${fmt(ganadoras / f.length * 100, 0)}%)` : '—', cls: 'pos' },
    { t: 'Perdedoras', v: String(f.length - ganadoras), cls: 'neg' },
    { t: 'DPT promedio', v: fmt(dptProm, 0) + ' días' },
  ]);
  tabla('#tCerradas', [
    { k: 'fecha_venta', t: 'Venta', f: r => String(r.fecha_venta).slice(0, 10) },
    { k: 'ticker', t: 'Título' },
    { k: 'broker_code', t: 'ALyC' },
    { k: 'account', t: 'Comitente' },
    { k: 'client_name', t: 'Cliente' },
    { k: 'quantity', t: 'Cantidad', n: 1, f: r => fmt(num(r.quantity), 0) },
    { k: 'fecha_compra', t: 'Compra', f: r => String(r.fecha_compra).slice(0, 10) },
    { k: 'dias_tenencia', t: 'DPT', n: 1, f: r => fmt(num(r.dias_tenencia), 0) },
    { k: usd ? 'precio_compra_usd' : 'precio_compra', t: `PPC ${sim()}`, n: 1, f: r => fmt(g(r, 'precio_compra', 'precio_compra_usd'), 2) },
    { k: usd ? 'precio_venta_usd' : 'precio_venta', t: `P. venta ${sim()}`, n: 1, f: r => fmt(g(r, 'precio_venta', 'precio_venta_usd'), 2) },
    { k: usd ? 'resultado_usd' : 'resultado', t: 'Result. precio', n: 1, color: 1, f: r => fmt(g(r, 'resultado', 'resultado_usd'), 0) },
    { k: usd ? 'rentas_cobradas_usd' : 'rentas_cobradas', t: 'Rentas', n: 1, f: r => fmt(g(r, 'rentas_cobradas', 'rentas_cobradas_usd'), 0) },
    { k: usd ? 'resultado_total_usd' : 'resultado_total', t: 'Result. total', n: 1, color: 1, f: r => fmt(g(r, 'resultado_total', 'resultado_total_usd'), 0) },
    { k: usd ? 'resultado_total_pct_usd' : 'resultado_total_pct', t: '% total', n: 1, color: 1, f: r => pct(g(r, 'resultado_total_pct', 'resultado_total_pct_usd')) },
    { k: usd ? 'tir_plazo_pct_usd' : 'tir_plazo_pct', t: 'TIR plazo', n: 1, color: 1, f: r => pct(g(r, 'tir_plazo_pct', 'tir_plazo_pct_usd')) },
    { k: usd ? 'tir_anual_pct_usd' : 'tir_anual_pct', t: 'TIR anual', n: 1, color: 1, f: r => pct(g(r, 'tir_anual_pct', 'tir_anual_pct_usd')) },
  ], { fecha_venta: `${f.length} cierres`, [usd ? 'resultado_total_usd' : 'resultado_total']: fmt(total, 0),
       [(usd ? 'resultado_total_usd' : 'resultado_total') + '_cls']: signo(total) });
}

function pintarAbiertas() {
  const usd = S.moneda === 'USD';
  const f = S.abiertas.filter(r => pasa(r));
  const g = (r, a, b) => num(usd ? r[b] : r[a]);
  const valor = f.reduce((s, r) => s + g(r, 'valor_mercado', 'valor_mercado_usd'), 0);
  const noReal = f.reduce((s, r) => s + g(r, 'resultado_no_realizado', 'resultado_no_realizado_usd'), 0);
  kpis('#kpisAbiertas', [
    { t: `Valor de mercado (${sim()})`, v: fmt(valor, 0) },
    { t: `No realizado (${sim()})`, v: fmt(noReal, 0), cls: signo(noReal) },
    { t: 'Posiciones', v: String(f.length) },
    { t: 'DPT promedio', v: f.length ? fmt(f.reduce((s, r) => s + num(r.dias_tenencia), 0) / f.length, 0) + ' días' : '—' },
  ]);
  tabla('#tAbiertas', [
    { k: 'ticker', t: 'Título' },
    { k: 'broker_code', t: 'ALyC' },
    { k: 'account', t: 'Comitente' },
    { k: 'client_name', t: 'Cliente' },
    { k: 'quantity', t: 'Cantidad', n: 1, f: r => fmt(num(r.quantity), 0) },
    { k: usd ? 'ppc_usd' : 'ppc', t: `PPC ${sim()}`, n: 1, f: r => fmt(g(r, 'ppc', 'ppc_usd'), 2) },
    { k: usd ? 'precio_spot_usd' : 'precio_spot', t: `Spot ${sim()}`, n: 1, f: r => fmt(g(r, 'precio_spot', 'precio_spot_usd'), 2) },
    { k: usd ? 'valor_mercado_usd' : 'valor_mercado', t: `Valor ${sim()}`, n: 1, f: r => fmt(g(r, 'valor_mercado', 'valor_mercado_usd'), 0) },
    { k: usd ? 'resultado_no_realizado_usd' : 'resultado_no_realizado', t: 'No realizado', n: 1, color: 1, f: r => fmt(g(r, 'resultado_no_realizado', 'resultado_no_realizado_usd'), 0) },
    { k: usd ? 'resultado_no_realizado_pct_usd' : 'resultado_no_realizado_pct', t: '%', n: 1, color: 1, f: r => pct(g(r, 'resultado_no_realizado_pct', 'resultado_no_realizado_pct_usd')) },
    { k: 'dias_tenencia', t: 'DPT', n: 1, f: r => fmt(num(r.dias_tenencia), 0) },
    { k: usd ? 'tir_anual_pct_usd' : 'tir_anual_pct', t: 'TIR anual', n: 1, color: 1, f: r => pct(g(r, 'tir_anual_pct', 'tir_anual_pct_usd')) },
    { k: 'fecha_primera_compra', t: 'Desde', f: r => String(r.fecha_primera_compra || '').slice(0, 10) },
  ], { ticker: `${f.length} posiciones`, [usd ? 'valor_mercado_usd' : 'valor_mercado']: fmt(valor, 0) });
}

// ── Control: lo calculado contra lo que informa el broker ──────────────
// Es la misma comparación que hace app/reconciliacion.py del lado del
// servidor. Acá se muestra para poder mirarla sin salir del módulo.
const EFECTIVO = new Set(['PESOS','$','USD_MEP','USD_DIVISA','USD_CABLE','USD D','USD C',
                          'CASH_ARS','CASH_USD','DOLAR EXT.','DOLARUSA']);
function desvios() {
  const clave = r => `${r.broker_code}|${r.account}|${String(r.ticker || '').toUpperCase()}`;
  const util = r => !EFECTIVO.has(String(r.ticker || '').toUpperCase()) && num(r.quantity) !== 0;
  const nuestro = new Map(), broker = new Map(), meta = new Map();
  S.abiertas.filter(util).forEach(r => { nuestro.set(clave(r), num(r.quantity)); meta.set(clave(r), r); });
  S.tenencias.filter(util).forEach(r => { broker.set(clave(r), num(r.quantity)); if (!meta.has(clave(r))) meta.set(clave(r), r); });
  const out = [];
  new Set([...nuestro.keys(), ...broker.keys()]).forEach(k => {
    const n = nuestro.get(k) || 0, b = broker.get(k) || 0;
    if (Math.abs(n - b) < 0.5) return;
    const r = meta.get(k);
    if (!pasa(r)) return;
    out.push({ broker_code: r.broker_code, account: r.account, client_name: r.client_name,
               ticker: String(r.ticker).toUpperCase(), nuestro: n, broker_dice: b,
               estado: b === 0 ? 'fantasma' : (n === 0 ? 'falta' : 'difiere') });
  });
  return out.sort((a, b) => a.estado.localeCompare(b.estado) || String(a.account).localeCompare(String(b.account)));
}

function pintarControl() {
  const d = desvios();
  const abiertas = S.abiertas.filter(r => pasa(r)).length;
  kpis('#kpisControl', [
    { t: 'Posiciones comparadas', v: String(abiertas) },
    { t: 'No cierran', v: String(d.length), cls: d.length ? 'neg' : 'pos' },
    { t: 'Fantasma', v: String(d.filter(x => x.estado === 'fantasma').length) },
    { t: 'Falta', v: String(d.filter(x => x.estado === 'falta').length) },
    { t: 'Difiere', v: String(d.filter(x => x.estado === 'difiere').length) },
  ]);
  tabla('#tControl', [
    { k: 'estado', t: 'Estado', f: r => `<span class="chip">${r.estado}</span>` },
    { k: 'broker_code', t: 'ALyC' },
    { k: 'account', t: 'Comitente' },
    { k: 'client_name', t: 'Cliente' },
    { k: 'ticker', t: 'Título' },
    { k: 'nuestro', t: 'Calculado', n: 1, f: r => fmt(r.nuestro, 2) },
    { k: 'broker_dice', t: 'Dice el broker', n: 1, f: r => fmt(r.broker_dice, 2) },
    { k: 'dif', t: 'Diferencia', n: 1, f: r => fmt(r.nuestro - r.broker_dice, 2) },
  ], d);
  $('#aviso').innerHTML = S.tab !== 'control' ? '' : (d.length
    ? `<div class="alerta"><b>${d.length}</b> posiciones no cierran contra la tenencia que informa el broker.
       Una cuenta que operó hace pocos días siempre va a diferir: el ledger se postea con la
       <b>liquidación</b> y la tenencia va por <b>concertación</b>. Si el desvío persiste después de
       liquidar, ahí sí falta historia.</div>`
    : '<div class="alerta ok">Todas las posiciones cierran contra la tenencia del broker.</div>');
}

// ── Opciones de los filtros (dependientes entre sí) ────────────────────
let ms = {};
function refrescarOpciones() {
  const universo = [...S.abiertas, ...S.realizado, ...S.curva];
  const uniq = (arr, f) => [...new Set(arr.map(f).filter(Boolean))].sort();
  const s = S.sel;
  const visto = universo.filter(r =>
    (!s.alyc.length || s.alyc.includes(r.broker_code)) &&
    (!s.cliente.length || s.cliente.includes(r.client_name)));
  ms.cliente.set(uniq(universo, r => r.client_name).map(v => ({ valor: v, texto: v })));
  ms.alyc.set(uniq(universo, r => r.broker_code).map(v => ({ valor: v, texto: v })));
  ms.cuenta.set(uniq(visto, r => String(r.account)).map(v => {
    const r = visto.find(x => String(x.account) === v);
    return { valor: v, texto: v, nota: r ? `${r.broker_code} · ${String(r.client_name || '').slice(0, 18)}` : '' };
  }));
  ms.ticker.set(uniq([...S.abiertas, ...S.realizado].filter(r =>
    (!s.cuenta.length || s.cuenta.includes(String(r.account)))), r => String(r.ticker || '').toUpperCase())
    .map(v => ({ valor: v, texto: v })));
}

function render() {
  ['evolucion', 'cerradas', 'abiertas', 'control'].forEach(t =>
    $('#tab-' + t).classList.toggle('hide', t !== S.tab));
  if (S.tab !== 'control') $('#aviso').innerHTML = '';
  if (S.tab === 'evolucion') pintarEvolucion();
  else if (S.tab === 'cerradas') pintarCerradas();
  else if (S.tab === 'abiertas') pintarAbiertas();
  else pintarControl();
}

// ── Carga ──────────────────────────────────────────────────────────────
async function cargar(fresh) {
  $('#sello').textContent = 'cargando…';
  const traer = async (t, orden) => {
    try { return await SibraMaestros.selectAll(t, orden); }
    catch (e) {
      // La tabla puede no existir todavía (el motor nunca la publicó): eso es
      // dato que falta, no un error del módulo.
      console.warn(`[rendimientos] ${t} no disponible:`, e.message);
      return [];
    }
  };
  const [curva, realizado, abiertas, tenencias] = await Promise.all([
    traer('brokers_curva', 'fecha'), traer('brokers_realizado', 'fecha_venta'),
    traer('brokers_posiciones_abiertas'), traer('brokers_tenencias'),
  ]);
  Object.assign(S, { curva, realizado, abiertas, tenencias });
  const faltan = [['curva', curva], ['posiciones cerradas', realizado],
                  ['posiciones abiertas', abiertas]].filter(([, v]) => !v.length).map(([n]) => n);
  $('#sello').textContent = faltan.length
    ? `⚠ sin datos de: ${faltan.join(', ')} — corré el rebuild del FIFO`
    : `${curva.length} cortes · ${realizado.length} cierres · ${abiertas.length} posiciones abiertas`;
  refrescarOpciones();
  render();
}

// ── Eventos ────────────────────────────────────────────────────────────
function grupo(host, campo, cb) {
  $(host).querySelectorAll('button').forEach(b => b.onclick = () => {
    $(host).querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); cb(b.dataset[campo]);
  });
}
grupo('#presets', 'p', v => { S.preset = v; aplicarPreset(v); render(); });
grupo('#moneda', 'm', v => { S.moneda = v; render(); });
grupo('#freq', 'f', v => { S.freq = v; render(); });
grupo('nav', 't', v => { S.tab = v; render(); });
$('#desde').onchange = $('#hasta').onchange = () => {
  $('#presets').querySelectorAll('button').forEach(x => x.classList.remove('on'));
  render();
};
$('#recargar').onclick = () => cargar(true);

['cliente', 'alyc', 'cuenta', 'ticker'].forEach(k => {
  const host = '#ms' + k[0].toUpperCase() + k.slice(1);
  ms[k] = multiselect(host, {
    placeholder: 'todos',
    onChange: v => { S.sel[k] = v; refrescarOpciones(); render(); },
  });
});

aplicarPreset('YTD');
cargar(false).catch(e => { $('#sello').textContent = 'no se pudo cargar: ' + e.message; });
</script>
